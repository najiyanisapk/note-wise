 if(a.length<4||b.length<4){ex=null;note=`err|Not enough suitable questions. Found ${a.length} of 4 for Section A and ${b.length} of 4 for Section B. Upload more papers or notes for this subject and module. Check each file's subject and module on the Upload page.`;return view()}
 const qs=[...a.map(q=>({...q,sec:"A",marks:5,stated:q.marks==5})),...b.map(q=>({...q,sec:"B",marks:10,stated:q.marks==10}))].map((q,i)=>({...q,id:i}));
 ex={s,mods,src,qs,ans:{},cur:0,end:Date.now()+90*60000,done:false};note="";save();view()}
function submit(){clearInterval(tick);ex.done=true;ex.self={};ex.ai=null;
 D.att.push({at:new Date().toLocaleString(),s:ex.s,scope:ex.mods.length==5?"All modules":MODS[ex.mods[0]],answered:Object.values(ex.ans).filter(v=>v&&v.trim()).length,qs:ex.qs.map(q=>({text:q.text,m:q.marks,a:ex.ans[q.id]||"",src:q.file,page:q.page})),self:null});save();view()}
async function evalAI(){const sm=await AI();if(!sm){note="err|AI is not available in this view. Use self-marking.";return view()}busy="Evaluating answers...";view();
 try{const r=await sm.json(`Mark these exam answers strictly. Return only JSON: [{"id":0,"marks":0,"feedback":"one short sentence"}]. Marks cannot exceed max.\n`+JSON.stringify(ex.qs.map(q=>({id:q.id,max:q.marks,question:q.text,answer:ex.ans[q.id]||""}))),{cache:false});
  ex.ai={};r.forEach(x=>{const q=ex.qs[x.id];if(q)ex.ai[x.id]={m:Math.max(0,Math.min(q.marks,+x.marks||0)),f:String(x.feedback||"")}});note="ok|Estimated scores added. They are not verified marks."}catch(e){note="err|Evaluation failed. Use self-marking."}busy="";save();view()}
function confirmD(t,b,fn){$("#dt").textContent=t;$("#db").textContent=b;const d=$("#dlg");d.showModal();$("#dy").onclick=()=>{d.close();fn()};$("#dn").onclick=()=>d.close()}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!ex||ex.done)return clearInterval(tick);const r=ex.end-Date.now();if(r<=0){const d=$("#dlg");if(d.open)d.close();submit();return}const e=$("#tm");if(e){e.textContent=Math.floor(r/60000)+":"+String(Math.floor(r%60000/1000)).padStart(2,"0")}},500)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>{note="ok|Copied.";view()},()=>{note="err|Copy was blocked by the browser.";view()})}catch(e){note="err|Copy is not available here.";view()}}
async function dl(name,text){try{const d=window.claude&&await claude.use("downloads");if(!d){note="err|Saving files is not available here. Use Copy.";return view()}await d.save({filename:name,data:text})}catch(e){if(!e||e.code!="declined"){note="err|The file could not be saved. Use Copy.";view()}}}
function qaText(f){return notesOf(f).map(t=>{const q=D.qa[f.id+"|"+t.t];return"## "+t.t+"\n"+(q?q.map(x=>`Q (${x.marks} marks): ${x.q}\nA: ${x.a}`).join("\n\n"):t.b)}).join("\n\n")}
const sub=(id,sel,fn)=>`<select id="${id}" aria-label="Subject" onchange="${fn}">${SUBJ.map((x,i)=>`<option value="${i}" ${i==sel?"selected":""}>${x}</option>`).join("")}</select>`;
const where=q=>q.gen?`Generated from ${esc(q.file)}${q.page?", page "+q.page:""}`:`Source: ${esc(q.file)}, ${q.page?"page "+q.page:"page not available"}`;
const srcT=q=>q.gen?`<span class="tag p">Generated practice question</span>`:`<span class="tag l">Previous-year question</span>`;
function msg(){if(!note)return"";const[k,t]=note.split(/\|(.*)/s);return`<div class="msg ${k=="err"?"err":""}" role="${k=="err"?"alert":"status"}">${esc(t)}</div>`}
const TABS=["Upload","Notes","Books","Ask doubt","Model exam","History"];
function view(){const app=$("#app");
 if(!user){$("#who").innerHTML="";$("#nav").innerHTML="";app.innerHTML=vEntry();return}
 $("#who").innerHTML=`<span class="mut">${esc(user)}</span><button class="ghost" onclick="out()">Sign out</button>`;
 $("#nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":"ghost"}" onclick="tab=${i};note='';view()">${t}</button>`).join("");
 app.innerHTML=(busy?`<div class="msg">${esc(busy)}</div>`:"")+msg()+[vUp,vNotes,vBooks,vDoubt,vExam,vHist][tab]();if(tab==4&&ex&&!ex.done)startTimer()}
function vEntry(){return`<div class="card hero"><h1>Study smarter with your own notes</h1><p>Upload your notes and question papers. Get topic-wise questions and answers, book references, a doubt box and a model exam.</p></div>
<div class="card"><div class="row"><button class="${authMode==0?"on":"ghost"}" onclick="authMode=0;note='';view()">Sign in</button><button class="${authMode==1?"on":"ghost"}" onclick="authMode=1;note='';view()">Create account</button></div>${msg()}
<label for="an">Name</label><input id="an" type="text" autocomplete="username"><label for="ap">PIN</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')auth()">
<div class="row" style="margin-top:.7rem"><button onclick="auth()">${authMode?"Create account":"Sign in"}</button></div>
<p class="mut">Accounts and data stay on this device and browser only. This is not a secure online login.</p></div>`}
function vUp(){return`<div class="card"><h2>Upload notes or papers</h2><p class="mut">Tap the file box and choose a PDF or TXT file from Documents. The subject and module are detected from your syllabus.</p>
<label>File type</label><select id="ut"><option value="notes">Study notes</option><option value="paper">Previous-year question paper</option></select>
<label>File</label><input type="file" accept="application/pdf,text/plain,.pdf,.txt" multiple onchange="upload(this)" ${busy?"disabled":""}>
<details style="margin-top:.7rem" ${ex2?"open":""}><summary>Paste text instead</summary><label for="mn">Title</label><input id="mn" type="text"><label for="mt">Text</label><textarea id="mt"></textarea><div style="margin-top:.5rem"><button onclick="manual()">Save text</button></div></details></div>
${ex2?`<div class="msg">Paste the text of ${esc(ex2.name)} above under "Paste text instead".</div>`:""}
<div class="card"><h2>Your files</h2>${D.files.length?D.files.map(f=>`<div style="border-top:2px solid var(--lv);padding:.6rem 0"><b>${esc(f.name)}</b> <span class="tag p">${f.type=="paper"?"Question paper":"Notes"}</span><span class="tag">${f.pages.length} page(s)</span>
<div class="grid"><div><label>Subject</label><select aria-label="Subject" onchange="setF(${f.id},'s',this.value)"><option value="">Not detected</option>${SUBJ.map((x,i)=>`<option value="${i}" ${f.s===i?"selected":""}>${x}</option>`).join("")}</select></div>
<div><label>Module</label><select aria-label="Module" onchange="setF(${f.id},'mod',this.value)"><option value="">Not detected</option>${MODS.map((x,i)=>`<option value="${i}" ${f.mod===i?"selected":""}>${x}</option>`).join("")}</select></div></div>
<div class="row" style="margin-top:.4rem"><button class="ghost" onclick="cf=${f.id};tab=1;view()">Open</button><button class="ghost" onclick="D.files=D.files.filter(y=>y.id!=${f.id});save();view()">Remove</button></div></div>`).join(""):`<p class="mut">No files yet. Upload your first file above.</p>`}</div>
<div class="msg">${storeOk?"Your data is saved on this device and browser only.":"Storage is full or blocked. Data may be lost on refresh."}</div>`}
function pickF(type){const l=D.files.filter(f=>f.type==type);return l}
function vNotes(){const nf=D.files.filter(f=>f.type=="notes");if(!nf.length)return`<div class="card"><h2>Notes</h2><p class="mut">No notes yet. Upload notes first.</p><button onclick="tab=0;view()">Go to Upload</button></div>`;
 const f=fOf(cf)&&fOf(cf).type=="notes"?fOf(cf):nf[0];cf=f.id;const all=topics(f),list=all.map((t,i)=>({t,i})).filter(x=>!ts||x.t.t.toLowerCase().includes(ts.toLowerCase()));
 const papers=D.files.filter(p=>p.type=="paper"&&p.s===f.s).flatMap(parseQs);
 return`<div class="card"><h2>Notes by topic</h2><label>File</label><select aria-label="File" onchange="cf=+this.value;ts='';view()">${nf.map(x=>`<option value="${x.id}" ${x.id==f.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
<p>${f.s!=null?`<span class="tag l">${SUBJ[f.s]}</span>`:`<span class="tag">Subject not detected</span>`}${f.mod!=null?`<span class="tag y">${MODS[f.mod]}</span>`:`<span class="tag">Module not detected</span>`}</p>
<label for="sq">Find a topic</label><input id="sq" type="search" value="${esc(ts)}" oninput="ts=this.value;view();const e=$('#sq');e.focus();e.setSelectionRange(ts.length,ts.length)"><p class="mut">Shortcuts: press / to search, j or k to move between topics.</p>
<div class="chips" style="margin:.5rem 0">${list.slice(0,40).map(x=>`<button onclick="document.getElementById('t${x.i}').scrollIntoView()">${esc(x.t.t.slice(0,28))}</button>`).join("")}</div>
<div class="row"><button class="ghost" onclick='copy(${J(qaText(f))})'>Copy all</button><button class="ghost" onclick='dl(${J(f.name.replace(/\W+/g,"_")+"_notes.md")},${J(qaText(f))})'>Save as file</button></div></div>
${!all.length?`<div class="card"><p class="mut">No topics were found. Notes need short topic headings on their own lines.</p></div>`:""}
${list.map(({t,i})=>{const qa=D.qa[f.id+"|"+t.t];const rel=papers.filter(q=>{const tt=toks(t.t);return tt.length&&tt.filter(w=>toks(q.text).includes(w)).length/tt.length>=.5});
 return`<div class="card topic" id="t${i}" tabindex="-1"><h3>${esc(t.t)}</h3>${t.p?`<span class="tag">Page ${t.p}</span>`:""}
${rel.length?`<p><b>Previous-year questions on this topic</b></p>`+rel.map(q=>`<p>${esc(q.text)}${q.marks?` <span class="tag">${q.marks} marks</span>`:""}<br><span class="mut">${where(q)}</span></p>`).join(""):""}
${qa&&qa.length?qa.map(x=>`<p><b>${esc(x.q)}</b> <span class="tag">${esc(x.marks)} marks</span><br><pre>${esc(x.a)}</pre></p>`).join("")+`<span class="tag p">AI-written from your notes. Check before use.</span>`:`<p><b>Your notes</b></p><pre>${esc(t.b.slice(0,900))}${t.b.length>900?"...":""}</pre>`}
<div class="row" style="margin-top:.5rem"><button ${qaBusy?"disabled":""} onclick="genQA(${f.id},${i})">${qaBusy==f.id+"|"+i?"Working...":qa?"Redo Q&A":"Make Q&A"}</button><button class="ghost" onclick='copy(${J(t.t+"\n"+(qa?qa.map(x=>x.q+"\n"+x.a).join("\n\n"):t.b))})'>Copy</button></div></div>`}).join("")}`}
function vBooks(){const fs=D.files.filter(f=>f.s!=null);if(!fs.length)return`<div class="card"><h2>Book references</h2><p class="mut">Upload a file first. Its subject and module are detected and matched to books.</p><button onclick="tab=0;view()">Go to Upload</button></div>`;
 const f=fOf(bf)&&fOf(bf).s!=null?fOf(bf):fs[0];bf=f.id;const text=D.files.filter(x=>x.s===f.s&&x.mod===f.mod).map(x=>x.pages.map(p=>p.text).join(" ")).join(" ");
 const mt=f.mod!=null&&SYLLABUS[f.s]?SYLLABUS[f.s][f.mod]:null,tk=new Set(toks(text));
 const hit=mt?mt.slice(1).filter(tp=>{const tt=toks(tp);return tt.length&&tt.filter(w=>tk.has(w)).length/tt.length>=.6}).slice(0,6):[];const list=BOOKS.filter(b=>b.s==f.s);
 return`<div class="card"><h2>Book references</h2><label>Detected from file</label><select aria-label="File" onchange="bf=+this.value;view()">${fs.map(x=>`<option value="${x.id}" ${x.id==f.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
<p><span class="tag l">${SUBJ[f.s]}</span>${mt?`<span class="tag y">${MODS[f.mod]}: ${esc(mt[0])}</span>`:`<span class="tag">Module not detected</span>`}</p>
${mt?(hit.length?`<div class="msg">Syllabus topics found in your file: ${esc(hit.join(", "))}.</div>`:""):`<div class="msg">Module is not detected. Set it on the Upload page. The full list for this subject is shown.</div>`}
<p class="mut">These books are listed in your syllabus for this subject. Chapter and page details are not provided. Check each book contents page for the topic.</p></div>
${list.map(b=>`<div class="card"><h3>${esc(b.t)}</h3><p>${esc(b.a)}</p><p class="mut">${esc(b.d)}</p><span class="tag l">${SUBJ[b.s]}</span><span class="tag p">${esc(b.k)}</span></div>`).join("")}
<button class="ghost" onclick='copy(${J(list.map((b,i)=>(i+1)+". "+b.a+", "+b.t+", "+b.d+".").join("\n"))})'>Copy bibliography</button>`}
function vDoubt(){const fs=D.files.filter(f=>f.type=="notes");
 return`<div class="card"><h2>Ask a doubt</h2><label>Use notes from</label><select id="df"><option value="0">No file</option>${fs.map(f=>`<option value="${f.id}" ${f.id==cf?"selected":""}>${esc(f.name)}</option>`).join("")}</select>
<label for="dq">Your doubt</label><textarea id="dq" placeholder="Type your question here"></textarea><div style="margin-top:.5rem"><button ${doubt.busy?"disabled":""} onclick="askDoubt()">Ask</button></div>
${doubt.a?`<div class="card" style="margin-top:.8rem;box-shadow:none;background:var(--pe)"><pre id="da">${esc(doubt.a)}</pre></div>`:""}
<p class="mut">Answers come from an AI service. They may contain mistakes. Check them with your notes and books.</p></div>`}
function vExam(){if(ex&&ex.done)return vRes();if(ex)return vRun();
 return`<div class="card"><h2>Model exam</h2><label>Subject</label>${sub("es",es,"es=+this.value")}<label>Module</label><select id="em"><option value="all">All five modules</option>${MODS.map((n,i)=>`<option value="${i}">${n}</option>`).join("")}</select>
<label>Exam source</label><select id="esrc"><option value="both">Question papers and notes</option><option value="papers">Question papers only</option><option value="notes">Notes only</option></select>
<div class="msg" style="background:var(--pe)"><b>Section A:</b> Answer all 4 questions. Each question carries 5 marks.<br><b>Section B:</b> Answer all 4 questions. Each question carries 10 marks.<br>Maximum marks: 60. Time allowed: 90 minutes.</div><button onclick="build()">Start exam</button></div>`}
function vRun(){const q=ex.qs[ex.cur],r=Math.max(0,ex.end-Date.now()),un=ex.qs.filter(x=>!(ex.ans[x.id]||"").trim()).length;
 return`<div class="card"><div class="row" style="justify-content:space-between"><h2>Question ${ex.cur+1} of 8</h2><div>Time left <span id="tm">${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")}</span></div></div>
<span class="tag l">Section ${q.sec}</span><span class="tag y">${q.marks} marks</span>${srcT(q)}${q.stated?"":`<span class="tag">Marks not stated in source</span>`}
<p style="margin-top:.6rem">${esc(q.text)}</p><p class="mut">${where(q)}</p><label for="an2">Your answer</label><textarea id="an2" style="min-height:200px" oninput="ex.ans[${q.id}]=this.value">${esc(ex.ans[q.id]||"")}</textarea>
<div class="row" style="margin-top:.6rem"><button class="ghost" ${ex.cur==0?"disabled":""} onclick="save();ex.cur--;view()">Previous</button><button class="ghost" ${ex.cur==7?"disabled":""} onclick="save();ex.cur++;view()">Next</button><button onclick="save();note='ok|Answer saved on this device.';view()">Save answer</button><button class="ghost" onclick="confirmD('Submit exam','You cannot change answers after submitting. Unanswered: ${un}.',submit)">Submit</button></div></div>
<div class="card"><h3>Question palette</h3><div class="pal">${ex.qs.map((x,i)=>`<button class="${(ex.ans[x.id]||"").trim()?"a":""} ${i==ex.cur?"c":""}" aria-label="Question ${i+1}, ${(ex.ans[x.id]||"").trim()?"answered":"unanswered"}" onclick="save();ex.cur=${i};view()">${i+1}</button>`).join("")}</div><p class="mut">Lavender: answered. Yellow: current.</p></div>`}
function vRes(){const a=D.att[D.att.length-1],tot=Object.values(ex.self||{}).reduce((x,y)=>x+(+y||0),0),ai=ex.ai?Object.values(ex.ai).reduce((x,y)=>x+y.m,0):null;
 return`<div class="card"><h2>Exam submitted</h2><p>Answered ${a.answered} of 8. Verified score: not available, because all questions are descriptive.</p>
<p><b>Self-assessed:</b> <span id="st">${tot}</span> of 60 <span class="tag">Not verified</span></p>${ai!=null?`<p><b>Estimated AI score:</b> ${ai} of 60 <span class="tag p">Estimate only</span></p>`:""}
<div class="row"><button ${busy?"disabled":""} onclick="evalAI()">Estimate score with AI</button><button class="ghost" onclick="ex=null;save();view()">Generate another paper</button></div></div>
${ex.qs.map(q=>`<div class="card"><h3>Q${q.id+1}. Section ${q.sec}, ${q.marks} marks</h3><p>${esc(q.text)}</p><p class="mut">${where(q)}</p><p><b>Your answer</b></p><pre>${esc(ex.ans[q.id]||"No answer given.")}</pre>
${ex.ai&&ex.ai[q.id]?`<p><span class="tag p">Estimated: ${ex.ai[q.id].m} of ${q.marks}</span> ${esc(ex.ai[q.id].f)}</p>`:""}
<label for="sf${q.id}">Marks you award yourself (0 to ${q.marks})</label><input id="sf${q.id}" type="number" min="0" max="${q.marks}" value="${ex.self[q.id]??""}" oninput="selfM(${q.id},this,${q.marks})" style="max-width:8rem"><p class="mut">Revise: ${esc(q.tp||q.text.slice(0,60))}</p></div>`).join("")}`}
function selfM(i,el,max){const v=Math.max(0,Math.min(max,+el.value||0));ex.self[i]=v;const s=Object.values(ex.self).reduce((x,y)=>x+y,0);D.att[D.att.length-1].self=s;save();$("#st").textContent=s}
function vHist(){return`<div class="card"><h2>Exam attempts</h2>${D.att.length?D.att.slice().reverse().map(a=>`<details style="border-top:2px solid var(--lv);padding:.5rem 0"><summary>${esc(a.at)}: ${esc(SUBJ[a.s])}, ${esc(a.scope)}. Answered ${a.answered} of 8. Self-assessed: ${a.self==null?"not entered":a.self+" of 60"}</summary>${a.qs.map((q,i)=>`<p><b>Q${i+1} (${q.m} marks)</b> ${esc(q.text)}</p><pre>${esc(q.a||"No answer given.")}</pre>`).join("")}</details>`).join(""):`<p class="mut">No attempts yet. Take a model exam to see results here.</p>`}</div>
<div class="card"><h2>Saved doubts</h2>${D.doubts.length?D.doubts.map((d,i)=>`<details style="border-top:2px solid var(--lv);padding:.5rem 0"><summary>${esc(d.q.slice(0,80))}</summary><pre>${esc(d.a)}</pre><p class="mut">${esc(d.at)}${d.f?", "+esc(d.f):""}</p><button class="ghost" onclick='copy(${J(d.q+"\n"+d.a)})'>Copy</button> <button class="ghost" onclick="D.doubts.splice(${i},1);save();view()">Remove</button></details>`).join(""):`<p class="mut">No doubts yet. Ask one in Ask doubt.</p>`}</div>
<button class="ghost" onclick="confirmD('Clear all data','This removes your files, doubts and attempts from this device.',()=>{D=blank();ex=null;save();view()})">Clear my data</button>`}
document.addEventListener("keydown",e=>{if(!user||tab!=1)return;const t=e.target.tagName;if(e.key=="/"&&t!="INPUT"&&t!="TEXTAREA"){e.preventDefault();const s=$("#sq");if(s)s.focus()}
 else if((e.key=="j"||e.key=="k")&&t!="INPUT"&&t!="TEXTAREA"){const c=[...document.querySelectorAll(".topic")];if(!c.length)return;let i=c.findIndex(x=>x.getBoundingClientRect().top>=-5);i=e.key=="j"?Math.min(c.length-1,(i<0?c.length-1:i)+(c[i]&&Math.abs(c[i].getBoundingClientRect().top)<5?1:0)):Math.max(0,(i<0?0:i)-1);c[i].scrollIntoView()}});
view();
</script></body></html>
